services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    ports:
      - '1433:1433'
    volumes:
      - mssql_data:/var/opt/mssql
      - .:/var/opt/mssql/import
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q ''SELECT 1'' || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build: .
    profiles: ['tools']
    env_file: .env
    environment:
      DB_SERVER: db
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    command: gunicorn -b 0.0.0.0:5000 smartmeter.api.app:app
    env_file: .env
    environment:
      DB_SERVER: db
    ports:
      - '5000:5000'
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  mssql_data:
